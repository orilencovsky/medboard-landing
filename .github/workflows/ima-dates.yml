# Daily check of the exam dates in tracks.json against the IMA exam
# calendar (scripts/check-ima-dates.mjs). Nothing is published from here:
#   - a changed date becomes a PR from bot/ima-dates, re-rendered and
#     tested, for the owner to merge;
#   - a calendar that cannot be read, a date that needs a person, or a
#     broken run opens (or edits) one issue, closed on the next clean run.
# README: "Exam dates".
name: IMA exam dates

on:
  schedule:
    - cron: '17 4 * * *' # 06:17 / 07:17 in Israel
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: ima-dates
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BRANCH: bot/ima-dates
      BOT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      ISSUE_TITLE: 'Exam-date check against the IMA calendar needs attention'
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compare with the IMA calendar
        id: check
        run: |
          set +e
          node scripts/check-ima-dates.mjs --report "$RUNNER_TEMP/report.md"
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          [ -f "$RUNNER_TEMP/report.md" ] || echo "The check script failed before writing a report (exit $code); see the run log." > "$RUNNER_TEMP/report.md"
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"
          if git diff --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      - name: Re-render the pages and run the tests
        id: build
        if: steps.check.outputs.changed == 'true'
        run: |
          set +e
          ok=true
          : > "$RUNNER_TEMP/failed.txt"
          for r in render-specialties render-exams render-tracks; do
            node "scripts/$r.mjs" > "$RUNNER_TEMP/log.txt" 2>&1 || { ok=false; echo "- scripts/$r.mjs" >> "$RUNNER_TEMP/failed.txt"; cat "$RUNNER_TEMP/log.txt" >> "$GITHUB_STEP_SUMMARY"; }
          done
          for f in scripts/*.test.mjs; do
            node --test "$f" > "$RUNNER_TEMP/log.txt" 2>&1 || { ok=false; echo "- $f" >> "$RUNNER_TEMP/failed.txt"; { echo '```'; tail -40 "$RUNNER_TEMP/log.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; }
          done
          echo "ok=$ok" >> "$GITHUB_OUTPUT"

      - name: Open or update the PR
        id: pr
        if: steps.check.outputs.changed == 'true'
        run: |
          {
            cat "$RUNNER_TEMP/report.md"
            echo
            if [ "${{ steps.build.outputs.ok }}" = "true" ]; then
              echo "Pages re-rendered; all tests pass."
            else
              echo "**A render or a test failed** (logs in the run summary):"
              cat "$RUNNER_TEMP/failed.txt"
            fi
            if [ "${{ steps.check.outputs.code }}" = "1" ]; then
              echo
              echo "**Needs a person before merging**: see \"Needs a person\" above. Edit on main, not on this branch."
            fi
            echo
            echo "Check each date on the IMA calendar before merging. Run: $RUN_URL"
          } > "$RUNNER_TEMP/body.md"
          title='Exam dates changed on the IMA calendar'
          if [ "${{ steps.check.outputs.code }}" = "1" ] || [ "${{ steps.build.outputs.ok }}" != "true" ]; then title="$title (needs a person before merging)"; fi
          git config user.name 'github-actions[bot]'
          git config user.email "$BOT_EMAIL"
          git switch -C "$BRANCH"
          git add -A
          { echo 'Update exam dates from the IMA calendar'; echo; cat "$RUNNER_TEMP/report.md"; } > "$RUNNER_TEMP/msg.txt"
          git commit -q -F "$RUNNER_TEMP/msg.txt"
          push=true
          if git fetch -q origin "$BRANCH" 2>/dev/null; then
            if git diff --quiet FETCH_HEAD HEAD; then
              push=false; echo "The bot branch already has this change."
            elif [ "$(git log -1 --format=%ae FETCH_HEAD)" != "$BOT_EMAIL" ]; then
              # Someone committed on the bot branch: never overwrite their work.
              push=false; echo "hand_edited=true" >> "$GITHUB_OUTPUT"
            fi
          fi
          if [ "$push" = true ]; then git push -f origin "$BRANCH"; fi
          if [ "$(gh pr view "$BRANCH" --json state -q .state 2>/dev/null)" = "OPEN" ]; then
            if [ "$push" = true ]; then gh pr edit "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/body.md"; fi
          elif ! gh pr create --base main --head "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/body.md"; then
            # Needs "Allow GitHub Actions to create and approve pull requests"
            # (Settings → Actions → General). Until then, the issue says so.
            echo "pr_failed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Close a bot PR that main has caught up with
        if: steps.check.outputs.changed == 'false' && steps.check.outputs.code != '2'
        run: |
          if [ "$(gh pr view "$BRANCH" --json state -q .state 2>/dev/null)" = "OPEN" ]; then
            gh pr close "$BRANCH" --comment "The dates on main match the IMA calendar now, so this change is no longer needed. Run: $RUN_URL"
          fi

      - name: Open, update or close the attention issue
        if: always()
        run: |
          number=$(gh issue list --state open --author 'app/github-actions' --search "in:title \"$ISSUE_TITLE\"" --json number,title -q ".[] | select(.title == \"$ISSUE_TITLE\") | .number" | head -1) || number=''
          need=false
          { echo "Run: $RUN_URL"; echo; } > "$RUNNER_TEMP/issue.md"
          code="${{ steps.check.outputs.code }}"
          if [ -n "$code" ] && [ "$code" != "0" ]; then
            need=true
            [ -f "$RUNNER_TEMP/report.md" ] && cat "$RUNNER_TEMP/report.md" >> "$RUNNER_TEMP/issue.md"
          fi
          if [ "${{ steps.pr.outputs.pr_failed }}" = "true" ]; then
            need=true
            { echo; echo "A date changed, but this workflow may not open PRs. The change is on branch \`$BRANCH\`:"
              echo "${{ github.server_url }}/${{ github.repository }}/compare/main...$BRANCH?expand=1"
              echo "To let it open PRs itself: Settings → Actions → General → Allow GitHub Actions to create and approve pull requests."; } >> "$RUNNER_TEMP/issue.md"
          fi
          if [ "${{ steps.pr.outputs.hand_edited }}" = "true" ]; then
            need=true
            { echo; echo "\`$BRANCH\` has commits that are not the bot's, so today's update was not pushed over them. Merge or close that PR, then the next run starts fresh."; } >> "$RUNNER_TEMP/issue.md"
          fi
          if [ "${{ job.status }}" != "success" ] || [ -z "$code" ]; then
            need=true; echo "The workflow itself failed; see the run." >> "$RUNNER_TEMP/issue.md"
          fi
          if [ "$need" = true ]; then
            # Editing the body, not commenting: one notification, not one a day.
            if [ -n "$number" ]; then gh issue edit "$number" --body-file "$RUNNER_TEMP/issue.md"; else gh issue create --title "$ISSUE_TITLE" --body-file "$RUNNER_TEMP/issue.md"; fi
          elif [ -n "$number" ]; then
            gh issue close "$number" --comment "This run needed no attention (run ${{ github.run_id }}). Any date change is in its own PR."
          fi
